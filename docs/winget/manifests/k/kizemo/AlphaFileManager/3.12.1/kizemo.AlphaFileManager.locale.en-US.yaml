ShortDescription: A dual-pane file manager for Windows and Linux with SFTP/FTP, compare-and-sync, batch rename and file unlock.
Description: |-
  Alpha File Manager is a dual-pane file manager for Windows and Linux, built with Tauri 2, Rust and Vue 3.

  Two panes, one navigator: the folder tree in the sidebar follows whichever pane you are in, and remote servers appear as a tree just like local folders. Favourites are grouped by category, so the folders you use every day are one click away.

  It speaks the protocols you actually use: SFTP, FTP and FTPS, with recursive compare-and-sync that tells you exactly what differs -- file by file, folder by folder -- before it touches anything, and never deletes anything on its own.

  Also included: batch rename, file comparison and synchronisation, an archive viewer, a quick preview panel, and a terminal.

  And when Windows refuses to delete a file, the right-click menu deals with it: it tells you which program is holding the file open, and it can remove the file anyway -- by clearing the read-only flag, marking it for deletion, or handing it to Windows to delete at the next restart.

  Version 3.12.1 is a fix release on top of 3.12.0: the two behaviours above did not actually take effect in the 3.12.0 installer, and this version delivers them. Shortcuts (.lnk) now always show the icon of the item they point at, regardless of the icon theme and the system-icons switch. The address-bar editor and its path suggestions use native Windows backslash paths (internally still forward-slash semantics, and the caret no longer jumps while typing). The Focus Sync component's Save As dialog also no longer fails: the bundled focus-sync-sidecar went from 0.5.15 to 0.5.18.
