# 应用自身的 Tauri 命令授权（app ACL manifest）
#
# Tauri 2.12 起：只要应用定义了 app 级 ACL manifest，**所有**自定义命令
# （含主窗本地来源）都会走 ACL 判定。因此这里必须把 lib.rs 里
# generate_handler! 注册的全部命令一次性列出，否则未列出的命令会被静默拒绝。
#
# 维护规则：新增 #[tauri::command] 后必须同步本文件 ——
# `cargo test --lib` 里的 app_acl_commands_cover_generate_handler 会当场抓出漏项。

[[permission]]
identifier = "allow-app-commands"
description = "Allows the application own Tauri commands (local origin)."
commands.allow = [
  "app_updates_managed_externally",
  "apply_image_edit",
  "batch_rename_execute",
  "batch_rename_history",
  "batch_rename_preview",
  "batch_rename_undo",
  "begin_outbound_drag_activation_watch",
