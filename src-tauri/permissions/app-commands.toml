# 远程源专用的最小授权：只放行「内嵌阿里云盘登录窗回报登录态」这一条命令。
# 这条权限只被 capabilities/aliyun-login.json 引用 —— 该 capability 的
# local=false、remote.urls 只覆盖 https://passport.alipan.com/*，
# 因此远程页面拿不到上面那 224 条命令里的任何其它一条。
[[permission]]
identifier = "allow-remote-aliyun-login-observed"
description = "Allows the embedded Aliyun Drive login webview (remote origin https://passport.alipan.com) to report the observed QR login state."
commands.allow = ["remote_aliyun_login_observed"]
